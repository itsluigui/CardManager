
name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Card Manager source
        run: |
          echo "COMMIT:"
          git rev-parse HEAD
          echo "SWIFT FILES:"
          find CardManager -name "*.swift" -print
          echo "WALLET CHECK:"
          grep -n "WalletView()" CardManager/Views.swift || true
          echo "SOURCE HASH:"
          shasum -a 256 CardManager/Views.swift

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project CardManager.xcodeproj \
            -scheme CardManager \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CardManager.app Payload/
          zip -r CardManager-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CardManager-unsigned-IPA
          path: CardManager-unsigned.ipa
